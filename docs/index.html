<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Android to iOS Before New Year — Interactive Engineering Academy</title>
  <meta name="description" content="A complete 10-week interactive tutorial bridging Android (Kotlin, Jetpack Compose, Coroutines) to modern iOS (Swift 6, SwiftUI, Swift Concurrency, SwiftData) by Sudhakar Raju." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Sticky Top Navigation -->
  <header class="topbar">
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Toggle Navigation Menu">
        <span></span><span></span><span></span>
      </button>
      <a href="#" class="brand" onclick="selectTab('roadmap')">
        <div class="brand-badges">
          <span class="pill pill-kotlin">Kotlin</span>
          <span>→</span>
          <span class="pill pill-swift">Swift 6</span>
        </div>
        <span>Android to iOS Academy</span>
      </a>
    </div>

    <div class="topbar-actions">
      <div id="xp-badge" class="xp-pill" title="Earn XP by completing daily micro-steps, flashcards, and quizzes!">
        ⚡ <span id="xp-count">0</span> XP
      </div>

      <div class="progress-pill" title="Your 10-Week Learning Progress (Saved in Browser)">
        <span id="progress-text">0/10 Weeks (0%)</span>
        <div class="progress-bar-mini">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
      </div>

      <button class="btn nav-tab-btn" id="nav-btn-roadmap" onclick="selectTab('roadmap')" title="Open 10-Week Roadmap & Orientation">
        🧭 Roadmap
      </button>

      <button class="btn nav-tab-btn" id="nav-btn-rosetta" onclick="selectTab('rosetta')" title="Open Android to iOS Rosetta Stone">
        🗺️ Rosetta Stone
      </button>

      <select id="theme-selector" class="theme-select" onchange="setTheme(this.value)" aria-label="Select Color Theme">
        <option value="aurora">✨ Aurora Vibrant</option>
        <option value="sepia">📖 Warm Paper</option>
        <option value="dark">🌙 Midnight Cosmos</option>
      </select>

      <a
        href="https://github.com/sudhakar-r08/ios-for-android-devs"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-primary github-star-btn"
      >
        ⭐ GitHub
      </a>
    </div>
  </header>

  <div id="sidebar-backdrop" class="sidebar-backdrop" onclick="toggleSidebar()"></div>

  <!-- Main Application Shell -->
  <div class="app-shell">
    <!-- Left Sidebar: 10-Week Academic Curriculum -->
    <aside class="sidebar" id="sidebar" aria-label="Course Curriculum Navigation">
      <!-- Search Bar -->
      <div class="sidebar-search-container">
        <div class="sidebar-search-box">
          <span class="search-icon">🔍</span>
          <input
            type="text"
            id="course-search-input"
            class="course-search-input"
            placeholder="Search lessons, Kotlin, Swift..."
            oninput="handleCourseSearch(this.value)"
            autocomplete="off"
          />
          <button id="clear-search-btn" class="clear-search-btn" onclick="clearCourseSearch()" title="Clear search">✕</button>
        </div>
      </div>

      <!-- Student Level & XP Card -->
      <div class="student-level-card">
        <div class="student-level-header">
          <span class="student-level-badge" id="student-rank-badge">🌱 Android Scout</span>
          <span class="student-level-xp" id="student-xp-display">0 XP</span>
        </div>
        <div class="student-subtext" id="student-completed-subtext">0 of 50 micro-steps completed</div>
      </div>

      <!-- Search Results Dropdown -->
      <div id="search-results-list" class="search-results-list" style="display:none;"></div>

      <!-- Curriculum Tree Grouped by Modules -->
      <div class="curriculum-container">
        <div class="sidebar-section-title">COURSE CURRICULUM</div>
        <div id="curriculum-tree" class="curriculum-tree"></div>
      </div>

      <!-- Footer Info -->
      <div class="sidebar-footer">
        <div style="font-weight:700;margin-bottom:0.25rem;">👨‍💻 Sudhakar Raju</div>
        <p style="color:var(--text-secondary);margin-bottom:0.45rem;font-size:0.78rem;">
          Learn modern iOS through Android mental models.
        </p>
        <a
          href="https://github.com/sudhakar-r08"
          target="_blank"
          rel="noopener noreferrer"
          style="color:var(--accent-primary);text-decoration:none;font-weight:700;font-size:0.78rem;"
        >
          @sudhakar-r08 on GitHub →
        </a>
      </div>
    </aside>

    <!-- Dynamic Main Content -->
    <main id="main-content" class="main-content" aria-live="polite"></main>
  </div>

  <script src="./data/weeks-1-to-3.js"></script>
  <script src="./data/weeks-4-to-6.js"></script>
  <script src="./data/weeks-7-to-10.js"></script>
  <script src="./app.js"></script>
</body>
</html>
