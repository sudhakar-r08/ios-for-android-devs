<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Android to iOS Before New Year — Interactive Engineering Academy</title>
  <meta name="description" content="A complete 10-week interactive tutorial bridging Android (Kotlin, Jetpack Compose, Coroutines) to modern iOS (Swift 6, SwiftUI, Swift Concurrency, SwiftData) by Sudhakar Raju." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Sticky Top Navigation -->
  <header class="topbar">
    <a href="#" class="brand" onclick="selectWeek(1)">
      <div class="brand-badges">
        <span class="pill pill-kotlin">Kotlin</span>
        <span>→</span>
        <span class="pill pill-swift">Swift 6</span>
      </div>
      <span>Android to iOS Academy</span>
    </a>

    <div class="topbar-actions">
      <div class="progress-pill" title="Your 10-Week Learning Progress (Saved in Browser)">
        <span id="progress-text">0/10 Weeks (0%)</span>
        <div class="progress-bar-mini">
          <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
      </div>

      <button class="btn" onclick="selectTab('rosetta')" title="Open Android to iOS Rosetta Stone">
        🗺️ Rosetta Stone
      </button>

      <select id="theme-selector" class="theme-select" onchange="setTheme(this.value)" aria-label="Select Color Theme">
        <option value="light">☀️ Cupertino Light</option>
        <option value="sepia">📖 Warm Paper</option>
        <option value="dark">🌙 Midnight Zinc</option>
      </select>

      <a
        href="https://github.com/sudhakar-r08/ios-for-android-devs"
        target="_blank"
        rel="noopener noreferrer"
        class="btn btn-primary"
      >
        ⭐ GitHub Repo
      </a>
    </div>
  </header>

  <!-- Main Application Shell -->
  <div class="app-shell">
    <!-- Left Sidebar: 10-Week Curriculum -->
    <aside class="sidebar" aria-label="10-Week Curriculum Navigation">
      <div>
        <div class="sidebar-section-title">10-Week Roadmap (Oct – Dec)</div>
        <ul id="week-nav-list" class="week-nav-list"></ul>
      </div>

      <div style="margin-top:auto;padding:0.9rem;background:var(--bg-surface);border-radius:var(--radius-sm);border:1px solid var(--border-color);font-size:0.8rem;">
        <div style="font-weight:700;margin-bottom:0.25rem;">👨‍💻 Created by Sudhakar Raju</div>
        <p style="color:var(--text-secondary);margin-bottom:0.5rem;">
          Learn iOS through Android mental models & publish weekly engineering insights.
        </p>
        <a
          href="https://github.com/sudhakar-r08"
          target="_blank"
          rel="noopener noreferrer"
          style="color:var(--accent-blue);text-decoration:none;font-weight:600;"
        >
          @sudhakar-r08 on GitHub →
        </a>
      </div>
    </aside>

    <!-- Dynamic Main Content -->
    <main id="main-content" class="main-content" aria-live="polite"></main>
  </div>

  <script src="./app.js"></script>
</body>
</html>
